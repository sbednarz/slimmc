[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyslimmc-opt"
version = "1.0.0"
description = "Bayesian optimization layer for Slimmc models"
requires-python = ">=3.9"
dependencies = [
  "pyslimmc>=4.0.0",
  "numpy>=1.23",
  "scipy>=1.9",
  "scikit-learn>=1.2",
]

[tool.setuptools]
package-dir = {pyslimmc_opt = "."}
packages = ["pyslimmc_opt"]
