name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  fast-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[test]" -e ./pyslimmc_opt
      - name: Show tool versions
        run: make info
      - name: Run unit, contract, and real integration tests
        run: |
          make test

  full-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
      - name: Install all test dependencies
        run: python -m pip install -e ".[test]" -e ./pyslimmc_opt
      - name: Compile and run the complete development suite
        run: make test-full
      - name: Verify cleanup
        run: |
          make clean
          python scripts/check_clean_tree.py
